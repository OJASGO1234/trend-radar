version: 2

models:
  - name: stg_yt_videos
    description: One row per YouTube video, cleaned title, is_short flag.
    columns:
      - name: video_id
        data_tests: [unique, not_null]
      - name: published_at
        data_tests: [not_null]

  - name: stg_yt_video_stats
    description: One row per video per snapshot day.
    columns:
      - name: video_day_key
        data_tests: [unique, not_null]
      - name: video_id
        data_tests:
          - not_null
          - relationships:          # every stats row must belong to a known video
              arguments:
                to: ref('stg_yt_videos')
                field: video_id
      - name: snapshot_date
        data_tests: [not_null]

  - name: stg_yt_comments
    columns:
      - name: comment_id
        data_tests: [unique, not_null]
      - name: video_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_yt_videos')
                field: video_id

  - name: stg_stream_events
    description: One row per streamed event (Bluesky, Wikipedia, Hacker News).
    columns:
      - name: event_key
        data_tests: [unique, not_null]
      - name: source
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['bluesky', 'wikipedia', 'hackernews']}
      - name: topic_group
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['gta6', 'ai_tech']}
      - name: event_time
        data_tests: [not_null]
      - name: is_reply
        data_tests: [not_null]
