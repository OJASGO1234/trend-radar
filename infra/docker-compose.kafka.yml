# Single-node Kafka in KRaft mode (broker + controller in one process, no ZooKeeper).
# Up:    docker compose -f infra/docker-compose.kafka.yml up -d
# Down:  docker compose -f infra/docker-compose.kafka.yml down        (add -v to wipe data)
name: trend-radar

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    mem_limit: 900m
    ports:
      - "9092:9092"          # host listener: Windows scripts use localhost:9092
    environment:
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # fixed so the data volume always matches

      # KRaft: this one node is both broker and controller
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      # Three listeners: HOST (Windows), INTERNAL (other containers), CONTROLLER (KRaft only)
      KAFKA_LISTENERS: "HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "HOST://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "HOST:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

      # One broker, so internal topics can only have 1 replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Topics only come from kafka-init below, so a typo can't silently create one
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # One-shot job: creates the topics, then exits. Re-running is safe (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms64m"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in raw.bluesky raw.wikipedia raw.hackernews; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1 \
            --config retention.ms=259200000
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list

volumes:
  kafka-data:
