# Prometheus PULLS: every 15 s it HTTP-GETs /metrics from each target below.
# The producers and the sink run on the Windows host, so we reach them via host.docker.internal.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: producers
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels: { source: bluesky }
      - targets: ["host.docker.internal:8002"]
        labels: { source: wikipedia }
      - targets: ["host.docker.internal:8003"]
        labels: { source: hackernews }

  - job_name: db_sink
    static_configs:
      - targets: ["host.docker.internal:8004"]
