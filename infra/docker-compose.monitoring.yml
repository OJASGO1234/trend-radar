# Prometheus + Grafana. Producers/sink run on the Windows host and expose /metrics on 8001-8004.
# Up:    docker compose -f infra/docker-compose.monitoring.yml up -d
# Down:  docker compose -f infra/docker-compose.monitoring.yml down       (add -v to wipe data)
# UIs:   Prometheus http://localhost:9090   Grafana http://localhost:3000 (admin / $GRAFANA_ADMIN_PASSWORD, default "admin")
name: trend-radar-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    mem_limit: 300m
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Docker Desktop already has it; this makes it work elsewhere too
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    mem_limit: 250m
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # local laptop only: lets you open the dashboard without logging in
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/trend-radar.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
